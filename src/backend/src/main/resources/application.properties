spring.application.name=groupsync-backend

server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:54329/groupsync_dev}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:groupsync}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=${APP_TIMEZONE:Asia/Bangkok}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}
app.cookie.secure=${APP_COOKIE_SECURE:false}
knowledge.storage.local-root=${KNOWLEDGE_STORAGE_LOCAL_ROOT:./knowledgeos-storage}
spring.servlet.multipart.max-file-size=${KNOWLEDGE_MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${KNOWLEDGE_MAX_UPLOAD_SIZE:25MB}
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
gemini.quality-model=${GEMINI_QUALITY_MODEL:gemini-3.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
gemini.rag-top-k=${RAG_TOP_K:5}
